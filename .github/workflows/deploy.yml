name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Project Directory
        id: select-dir
        shell: bash
        run: |
          if [ -d "student-profile-&-academic-portal---nagasri-s" ]; then
            echo "project_path=student-profile-&-academic-portal---nagasri-s" >> "$GITHUB_OUTPUT"
          else
            echo "project_path=." >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ steps.select-dir.outputs.project_path }}/package.json

      - name: Install dependencies
        working-directory: ${{ steps.select-dir.outputs.project_path }}
        run: npm ci || npm install

      - name: Build project
        working-directory: ${{ steps.select-dir.outputs.project_path }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.select-dir.outputs.project_path }}/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
